site_name: RL-study
site_description: LLM 강화학습을 수식과 실행 가능한 PyTorch 코드로 배우는 self-contained 강좌
site_url: https://bangprox.github.io/RL-study/
repo_url: https://github.com/BangProx/RL-study
repo_name: BangProx/RL-study
edit_uri: edit/main/docs/
copyright: Copyright 2026 BangProx and RL-study contributors · Apache-2.0

hooks:
  - scripts/mkdocs_hooks.py

theme:
  name: material
  language: ko
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: 어두운 화면으로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: 밝은 화면으로 전환

nav:
  - 홈: index.md
  - 15분 시작: getting-started.md
  - 강좌 지도: course-map.md
  - English course map: course-map.en.md
  - 수학 최소 도구함: math.md
  - 용어집: glossary.md
  - 알고리즘:
      - 한눈에 비교: algorithms/cards.md
      - 고전 RL: algorithms/classic.md
      - LLM·선호·보상: algorithms/llm-foundations.md
      - RLHF-PPO: algorithms/rlhf-ppo.md
      - DPO: algorithms/dpo.md
      - GRPO 계열: algorithms/grpo-family.md
      - DAPO: algorithms/dapo.md
      - Agentic RL: algorithms/agentic-rl.md
  - 실행:
      - 하드웨어·프로필: hardware.md
      - Laptop·server 상세: profiles/laptop-server.md
      - 문제 해결: troubleshooting.md
      - 알려진 한계: known-limitations.md
  - 참고·재현성:
      - 실행 근거 읽기: research/README.md
      - 출처와 provenance: provenance.md
      - 문헌 감사: research/C1_SOURCE_AUDIT.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

strict: true
