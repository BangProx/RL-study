schema_version: 1
profile: toy
algorithm:
  name: rloo
  variant: paper-sequence-reinforce
  gamma: 1.0
  kl_coefficient: 0.02
  advantage_normalization: leave-one-out
  loss_reduction: sequence-sum
  update_epochs: 1
  reward_source: verifier
data:
  id: tiny_reasoning
  revision: generated-v1
  split: train
  seed: 42
model:
  policy: tiny-v1
  reference: tiny-v1-frozen
  reward: deterministic-verifier
training:
  seed: 42
  steps: 8
  batch_size: 2
  group_size: 4
  response_token_budget: 32768
  max_new_tokens: 22
  device: cpu
  allow_device_fallback: false
evaluation:
  every_steps: 2
  split: validation
output:
  root: artifacts
