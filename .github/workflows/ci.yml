name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / CPU
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install core and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check dependency resolution
        run: python -m pip check
      - name: Run CPU tests
        run: python -m pytest

  static-and-docs:
    name: Static, notebooks, links, MkDocs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install -e ".[dev,notebooks,docs]"
      - name: Lint and type check
        run: |
          python -m ruff check .
          python -m mypy src
      - name: Validate generated learning artifacts
        run: |
          python scripts/check_provenance.py
          python scripts/check_release_contract.py
          python scripts/check_notebook_contract.py --language all --require-executed
          python scripts/check_bilingual_parity.py
          python scripts/check_colab_contract.py
      - name: Validate local links and strict documentation build
        run: |
          python scripts/check_links.py --local
          python -m mkdocs build --strict
