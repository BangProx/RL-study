<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">PPO, DPO, GRPO, DAPO 비교 지도</title>
  <desc id="description">네 알고리즘이 사용하는 데이터, baseline, 목적함수와 안정화 장치를 나란히 비교한다.</desc>
  <rect width="1200" height="630" rx="28" fill="#0f172a"/>
  <text x="60" y="72" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700">PPO → DPO → GRPO → DAPO: 무엇이 달라지는가?</text>
  <text x="60" y="110" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19">알고리즘 이름보다 데이터 · baseline · ratio · reduction을 먼저 본다</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(48 150)">
      <rect width="264" height="385" rx="20" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
      <text x="24" y="48" fill="#93c5fd" font-size="28" font-weight="700">PPO</text>
      <text x="24" y="84" fill="#f8fafc" font-size="17">online trajectory</text>
      <text x="24" y="116" fill="#cbd5e1" font-size="16">baseline: critic + GAE</text>
      <line x1="24" y1="140" x2="240" y2="140" stroke="#334155"/>
      <text x="24" y="180" fill="#f8fafc" font-size="18" font-weight="600">clipped token ratio</text>
      <text x="24" y="214" fill="#bfdbfe" font-size="16">min(rₜAₜ, clip(rₜ)Aₜ)</text>
      <text x="24" y="266" fill="#94a3b8" font-size="15">update</text>
      <text x="24" y="294" fill="#e2e8f0" font-size="16">policy + value</text>
      <text x="24" y="338" fill="#94a3b8" font-size="15">핵심 경계</text>
      <text x="24" y="366" fill="#e2e8f0" font-size="16">old ≠ current policy</text>
    </g>

    <g transform="translate(328 150)">
      <rect width="264" height="385" rx="20" fill="#3b1d2a" stroke="#fb7185" stroke-width="2"/>
      <text x="24" y="48" fill="#fda4af" font-size="28" font-weight="700">DPO</text>
      <text x="24" y="84" fill="#f8fafc" font-size="17">offline preference pairs</text>
      <text x="24" y="116" fill="#cbd5e1" font-size="16">baseline: frozen reference</text>
      <line x1="24" y1="140" x2="240" y2="140" stroke="#4c2934"/>
      <text x="24" y="180" fill="#f8fafc" font-size="18" font-weight="600">pair classification</text>
      <text x="24" y="214" fill="#fecdd3" font-size="15">−log σ(β(Δlogπ−Δlogπref))</text>
      <text x="24" y="266" fill="#94a3b8" font-size="15">update</text>
      <text x="24" y="294" fill="#e2e8f0" font-size="16">policy only</text>
      <text x="24" y="338" fill="#94a3b8" font-size="15">핵심 경계</text>
      <text x="24" y="366" fill="#e2e8f0" font-size="16">chosen ≠ rejected</text>
    </g>

    <g transform="translate(608 150)">
      <rect width="264" height="385" rx="20" fill="#14352d" stroke="#34d399" stroke-width="2"/>
      <text x="24" y="48" fill="#6ee7b7" font-size="28" font-weight="700">GRPO</text>
      <text x="24" y="84" fill="#f8fafc" font-size="17">online response groups</text>
      <text x="24" y="116" fill="#cbd5e1" font-size="16">baseline: group statistics</text>
      <line x1="24" y1="140" x2="240" y2="140" stroke="#255247"/>
      <text x="24" y="180" fill="#f8fafc" font-size="18" font-weight="600">group-relative advantage</text>
      <text x="24" y="214" fill="#a7f3d0" font-size="16">Aᵢ = (rᵢ − mean(r)) / std(r)</text>
      <text x="24" y="266" fill="#94a3b8" font-size="15">update</text>
      <text x="24" y="294" fill="#e2e8f0" font-size="16">policy, no value model</text>
      <text x="24" y="338" fill="#94a3b8" font-size="15">핵심 경계</text>
      <text x="24" y="366" fill="#e2e8f0" font-size="16">zero-variance group</text>
    </g>

    <g transform="translate(888 150)">
      <rect width="264" height="385" rx="20" fill="#3b2a14" stroke="#fbbf24" stroke-width="2"/>
      <text x="24" y="48" fill="#fcd34d" font-size="28" font-weight="700">DAPO</text>
      <text x="24" y="84" fill="#f8fafc" font-size="17">GRPO-family rollout</text>
      <text x="24" y="116" fill="#cbd5e1" font-size="16">baseline: group statistics</text>
      <line x1="24" y1="140" x2="240" y2="140" stroke="#59421f"/>
      <text x="24" y="180" fill="#f8fafc" font-size="18" font-weight="600">four explicit fixes</text>
      <text x="24" y="216" fill="#fde68a" font-size="16">clip-higher</text>
      <text x="24" y="246" fill="#fde68a" font-size="16">dynamic sampling</text>
      <text x="24" y="276" fill="#fde68a" font-size="16">token-level loss</text>
      <text x="24" y="306" fill="#fde68a" font-size="16">overlong shaping</text>
      <text x="24" y="350" fill="#94a3b8" font-size="15">핵심 경계</text>
      <text x="24" y="378" fill="#e2e8f0" font-size="16">각 요소를 따로 검증</text>
    </g>
  </g>

  <text x="60" y="585" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">RL-study · 수식 → 작은 tensor → PyTorch → 실행 가능한 검사</text>
</svg>
