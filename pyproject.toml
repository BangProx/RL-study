[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-study"
version = "0.1.0"
description = "Self-contained reinforcement learning course and clean-room reference implementations for LLMs"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
authors = [{name = "BangProx and RL-study contributors"}]
keywords = ["reinforcement-learning", "rlhf", "dpo", "grpo", "education"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "matplotlib>=3.10,<4",
  "numpy>=2.0,<2.3; python_version < '3.11'",
  "numpy>=2.0,<3; python_version >= '3.11'",
  "PyYAML>=6.0.2,<7",
  "torch>=2.13,<2.14",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0.12,<7",
]
notebooks = [
  "ipykernel>=6.30,<7",
  "jupyter>=1.1,<2",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
]
laptop = [
  "accelerate>=1.10,<2",
  "datasets>=4,<5",
  "peft>=0.17,<1",
  "transformers>=4.55,<5",
  "trl==1.10.0",
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.6,<10",
]

[project.scripts]
rl-study = "rl_study.cli:main"

[project.urls]
Repository = "https://github.com/BangProx/RL-study"
Documentation = "https://github.com/BangProx/RL-study#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: crosses more than one package boundary",
  "network: requires explicit network access",
  "slow: expected to take more than 10 seconds",
]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"scripts/generate_notebooks.py" = ["E501"]
"scripts/generate_colab.py" = ["E501"]
"src/rl_study/reporting/demo.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["rl_study"]
mypy_path = "src"
warn_unused_configs = true
